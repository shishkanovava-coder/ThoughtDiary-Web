const key='thought-diary-v1';let data=[],current=null;const main=document.querySelector('#main');let storageOK=true;try{data=JSON.parse(localStorage.getItem(key)||'[]');document.body.classList.toggle('light',localStorage.getItem(key+'-theme')==='light')}catch(e){storageOK=false}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function numberEntries(){[...data].sort((a,b)=>String(a.id).localeCompare(String(b.id))).forEach((e,i)=>{e.number=i+1})}function save(){numberEntries();try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){return false}}function status(){let x=document.querySelector('#status');if(x)x.textContent=save()?'Сохранено на устройстве':'Не удалось сохранить — сделай резервную копию'}function fresh(quick=false){current={id:Date.now().toString()+Math.random().toString(36).slice(2),date:today(),title:'',fields:Array(7).fill(''),emotions:[{name:'',before:50,after:50}],belief:50,completed:false};data.unshift(current);save();edit(current.id,quick)}function tab(t){document.querySelector('header h1').textContent=t==='settings'?'Настройки':t==='exercises'?'Упражнения КПТ':'Дневник мыслей';document.querySelector('.gear').classList.toggle('active',t==='settings');for(const n of ["home","stats","exercises"])document.getElementById("tab-"+n).classList.toggle("active",n===t)}function home(){numberEntries();save();tab("home");current=null;main.innerHTML='<p '+(storageOK?'hidden':'')+'>Хранилище недоступно.</p><button class="primary wide" onclick="fresh()">＋ Новая запись</button><button class="secondary" style="margin-top:8px" onclick="fresh(true)">⚡ Быстрая запись</button><h2>Мои записи</h2><input id="search" placeholder="Поиск по записям" oninput="list()"><label>Фильтр по дате<input type="date" id="filter" onchange="list()"></label><div id="entries"></div>';list()}function list(){let q=document.querySelector('#search').value.toLowerCase(),d=document.querySelector('#filter').value;let root=document.querySelector('#entries');root.replaceChildren();for(let e of data.filter(e=>(!d||e.date===d)&&JSON.stringify(e).toLowerCase().includes(q)).sort((a,b)=>b.number-a.number)){let a=document.createElement('article');a.className='entry';let timer=null,held=false,sx=0,sy=0;const stop=()=>{clearTimeout(timer);timer=null};function menu(){stop();held=true;let overlay=el('div',document.body);overlay.className='entry-menu-overlay';let panel=el('div',overlay);panel.className='entry-menu-panel';el('h2',panel,'Запись №'+e.number);btn(panel,'Удалить',()=>{overlay.remove();if(confirm('Удалить запись №'+e.number+'?')){let previous=data;data=data.filter(x=>x.id!==e.id);if(save())home();else{data=previous;alert('Не удалось удалить запись')}}},'entry-delete wide');btn(panel,'Отмена',()=>overlay.remove(),'secondary');overlay.onclick=ev=>{if(ev.target===overlay)overlay.remove()}}a.onpointerdown=ev=>{if(ev.button!==0)return;held=false;sx=ev.clientX;sy=ev.clientY;stop();timer=setTimeout(menu,550)};a.onpointermove=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>10)stop()};a.onpointerup=stop;a.onpointercancel=stop;a.onpointerleave=stop;a.oncontextmenu=ev=>{ev.preventDefault();if(!held)menu()};a.onclick=()=>{if(!held)edit(e.id);held=false};a.innerHTML='<div class="entry-meta"><small>Запись №'+e.number+' · '+esc(e.date)+'</small><span class="entry-status '+(e.completed?'done':'draft')+'">'+(e.completed?'Завершено':'Черновик')+'</span></div><h2>'+esc(e.title||e.fields[0].slice(0,60)||'Без названия')+'</h2>'+e.emotions.filter(x=>x.name).map(x=>'<p>'+esc(x.name)+' · '+x.before+'% → '+x.after+'%</p>').join('');let count=e.fields.filter((v,i)=>i===1?e.emotions.some(x=>x.name.trim()):i===6?e.completed||v.trim():v.trim()).length;el('small',a,'Заполнено '+count+' из 7 разделов (приблизительно)');let bar=el('div',a);bar.className='bar';el('i',bar).style.width=count/7*100+'%';root.append(a)}if(!root.children.length)root.textContent='Нет записей.'}
const names=['Ситуация','Настроение','Автоматические мысли и образы','Доказательства в поддержку заряженной мысли','Доказательства, опровергающие заряженную мысль','Альтернативные или взвешенные мысли','Настроение на данный момент'];const hints=["С кем вы были?\nЧто вы делали?\nКогда это произошло?\nГде вы были?", "Опишите каждое настроение одним словом.\nОцените интенсивность каждого настроения (0–100 %).\nОбведите настроение, которое вы хотели бы изучить.", "Ответьте на два общих вопроса, а затем на некоторые или все вопросы, относящиеся к настроению, которое вы изучаете.\nЧто возникло в моем сознании перед тем, как я начал испытывать это чувство? (Общий)\nКакие образы и воспоминания возникли в моем сознании в этой ситуации? (Общий)\nЧто это говорит обо мне? Моей жизни? Моем будущем? (Депрессия)\nЧего я опасаюсь? (Тревога)\nЧто самое худшее может произойти? (Тревога)\nЧто это говорит о том, что думают обо мне и что чувствуют по отношению ко мне другие люди? (Тревога)\nЧто это говорит о других людях или людях в целом? (Гнев)\nНарушил ли я правила, обидел ли кого-то или не сделал того, что должен был сделать? Что я думаю о себе, если я это сделал или мне кажется, что я это сделал? (Вина, стыд)\nВыделите заряженную мысль.", "Выпишите заряженную мысль из предыдущей графы, для которой вы искали доводы.\nВыпишите факты в поддержку данного заключения.\nПопытайтесь писать факты, а не интерпретации. Факт — то, что можно наблюдать или проверить; интерпретация — ваше объяснение происходящего.", "Чтобы найти доводы для опровержения заряженной мысли, задайте себе вопросы:\nКакие факты не согласуются с этой мыслью?\nБыли ли случаи, когда происходило обратное?\nНе упускаю ли я важные обстоятельства?\nЧто мог бы заметить другой человек в этой ситуации?\nЕсть ли факты, которые я обесцениваю или игнорирую?", "Перечитайте доказательства в поддержку и против заряженной мысли.\nКакой вывод учитывает обе стороны?\nЕсть ли другое объяснение ситуации?\nЧто я сказала бы близкому человеку в такой ситуации?\nКак сформулировать мысль так, чтобы она была реалистичной, а не просто позитивной?\nВыпишите альтернативные или взвешенные мысли.\nОцените свою уверенность в каждой альтернативной или взвешенной мысли (0–100 %).", "Скопируйте настроение из второго столбца.\nПроведите повторную оценку каждого настроения (0–100 %), а также любого нового настроения."];
function fitText(t){t.style.height='auto';t.style.height=Math.max(110,t.scrollHeight+t.offsetHeight-t.clientHeight)+'px'}function fitAll(){document.querySelectorAll('textarea').forEach(fitText)}document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')fitText(e.target)});window.addEventListener('resize',fitAll);function el(tag,parent,txt){let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;parent.append(x);if(tag==='textarea')requestAnimationFrame(()=>{if(x.isConnected)fitText(x)});return x}function btn(p,t,f,cls){let b=el('button',p,t);b.onclick=f;b.className=cls||'';return b}function input(p,type,value,fn,placeholder){let x=el('input',p);x.type=type;x.value=value;x.placeholder=placeholder||'';x.oninput=()=>{fn(x.value);status()};return x}function slider(p,label,value,fn){const round=v=>Math.max(0,Math.min(100,Math.round(Number(v)/5)*5));let l=el('label',p,label+' — '),o=el('output',l,value+'%');let x=input(l,'range',round(value),v=>{let n=round(v);o.textContent=n+'%';fn(n)});x.min=0;x.max=100;x.step=5;x.value=round(value)}const guidance=[
['Опишите событие так, как его могла бы записать камера: кто, где, когда, что сказал или сделал. Не включайте догадки о намерениях.','Например: я показала рисунок, а человек указал на ошибку. Вместо: он считает меня бездарной.'],
